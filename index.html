    <link rel="manifest" href="/manifest.json" />
    <script>
      // Automatically detect and recover from stale service worker chunk/bundle load errors
      window.addEventListener('error', function(e) {
        const msg = e.message || '';
        if (msg.includes('Importing a module script') || msg.includes('loading chunk') || msg.includes('dynamically imported')) {
          console.warn('Asset loading failure. Resetting service worker caches and reloading...');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (let r of regs) r.unregister();
            });
          }
          if (window.caches) {
            caches.keys().then(function(keys) {
              for (let k of keys) caches.delete(k);
            });
          }
          setTimeout(function() { window.location.reload(true); }, 200);
        }
      }, true);

      window.addEventListener('vite:preloadError', function() {
        console.warn('Vite preload error. Resetting service worker caches and reloading...');
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (let r of regs) r.unregister();
          });
        }
        if (window.caches) {
          caches.keys().then(function(keys) {
            for (let k of keys) caches.delete(k);
          });
        }
        setTimeout(function() { window.location.reload(true); }, 200);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
